[project]
name = "keras-notebooks"
version = "0.1.0"
description = "Keras / TensorFlow notebook experiments"
requires-python = ">=3.12"
dependencies = [
    "tensorflow==2.17.0",
    "scikit-learn",
    "tensorflow-metal==1.2.0",
    "numpy>=1.26",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
    "kagglehub>=0.3.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "keras-hub>=0.19.0",
    "ucimlrepo>=0.0.7",
    "pydot>=4.0.1",
]
